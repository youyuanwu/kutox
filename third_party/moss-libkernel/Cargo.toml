[package]
name = "moss-libkernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
fs = ["dep:ext4plus"]

[dependencies]
ext4plus = { version = "=0.1.0-rc.2", default-features = false, features = ["sync"], optional = true }

[package.metadata.upstream]
repository = "https://github.com/hexagonal-sun/moss-kernel"
revision = "1358b5d78b9151e382dc60ccda7fe0de191e56af"
sources = [
    "libkernel/src/lib.rs",
    "libkernel/src/memory/allocators/smalloc.rs",
    "libkernel/src/memory/address.rs",
    "libkernel/src/memory/region.rs",
    "libkernel/src/memory/address_space.rs",
    "libkernel/src/memory/paging/permissions.rs",
    "libkernel/src/sync/spinlock.rs",
    "libkernel/src/sync/waker_set.rs",
    "src/sched/sched_task/state.rs",
    "src/process/exec.rs",
    "src/process/ctx.rs",
    "libkernel/src/memory/proc_vm/vmarea.rs",
    "libkernel/src/fs/blk/ramdisk.rs",
    "libkernel/src/fs/blk/buffer.rs",
    "libkernel/src/fs/filesystems/ext4/mod.rs",
]
