[package]
name = "kutox"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
limine = "0.5"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
