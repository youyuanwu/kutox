[package]
name = "kutox"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[workspace]
members = ["third_party/moss-libkernel"]
default-members = ["."]
resolver = "2"

[features]
default = ["guest-tests"]
guest-tests = []

[dependencies]
limine = "0.5"
moss-libkernel = { path = "third_party/moss-libkernel", features = ["fs"] }
smoltcp = { version = "=0.13.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "auto-icmp-echo-reply",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
    "dns-max-server-count-2",
    "dns-max-result-count-4",
    "iface-max-addr-count-1",
    "iface-neighbor-cache-count-8",
    "iface-max-route-count-1",
] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
