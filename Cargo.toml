[package]
name = "kutox"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[workspace]
members = ["third_party/moss-boot-memory", "third_party/moss-sync"]
default-members = ["."]
resolver = "2"

[dependencies]
limine = "0.5"
moss-boot-memory = { path = "third_party/moss-boot-memory" }
moss-sync = { path = "third_party/moss-sync" }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
